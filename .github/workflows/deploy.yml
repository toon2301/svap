name: CI

# Produkcia sa nasadzuje cez Railway (auto-deploy z gitu), nie cez tento workflow.
# Tu bežia testy (jest + pytest) a build/kontroly – starý legacy deploy krok bol
# odstránený. Aby červené CI reálne blokovalo nasadenie, musí byť v Railway
# zapnuté "Wait for CI" (nastavenie mimo repa).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Node 22 LTS = verzia z `engines` vo frontend/package.json (Node 18 a 20 už nemajú podporu; Playwright 1.63 vyžaduje Node >= 20).
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    # Každý kľúč použitý v kóde ako `t('...')` musí existovať v messages/sk.json (nález 204). Beží hneď po `npm ci`,
    # pred testami a buildom, takže chýbajúci preklad zlyhá rýchlo. Úplnosť ostatných jazykov overuje nasledujúci krok.
    - name: Check used translation keys
      working-directory: ./frontend
      run: npm run check:used-translation-keys

    # Každý kľúč zo sk.json musí existovať aj v en, de, cs, hu a pl (nález 297). Dopĺňa predchádzajúcu kontrolu: tá overí,
    # že kód nepoužíva neexistujúci kľúč, táto, že ten istý kľúč je preložený vo všetkých jazykoch. Kontroluje len
    # prítomnosť kľúčov, nie to, či text nie je slovenská kópia (nález 176).
    - name: Check missing translations
      working-directory: ./frontend
      run: npm run check:missing-translations

    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test -- --ci --reporters=default --reporters=github-actions

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    # Python 3.11 = verzia z backend/Dockerfile; Pillow 13 vyžaduje Python >= 3.11.
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-test.txt

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-test.txt

    - name: Run Django system checks
      working-directory: ./backend
      run: python manage.py check --settings=swaply.settings
      env:
        DEBUG: 'True'
        SECRET_KEY: ci-check-secret
        SAFESEARCH_ENABLED: 'False'

    # Celá backend suita (sqlite fallback, bez externých služieb). Coverage je
    # vypnutá (--no-cov): gate --cov-fail-under=85 z pytest.ini je aktuálne pod
    # prahom (~80 %) — CI stráži pass/fail testov, coverage sa rieši samostatne.
    - name: Run backend tests
      working-directory: ./backend
      run: python -m pytest --no-cov
      env:
        DEBUG: 'True'
        SECRET_KEY: ci-check-secret
        SAFESEARCH_ENABLED: 'False'

  # Backend aj na PostgreSQL. Produkcia (Railway) beží na PostgreSQL 17, no job `checks` používa SQLite, kde sa osem testov
  # so zámkami riadkov (`select_for_update`: limit ponúk, značky príspevkov, blokovanie žiadostí a správ) preskakuje, takže
  # v CI nebežali nikdy. Samostatný job beží súbežne s `checks`, preto sa čas CI nepredlžuje.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: svaply
          # Jednorazové heslo kontajnera, ktorý žije len počas tohto jobu.
          POSTGRES_PASSWORD: svaply-ci
          POSTGRES_DB: svaply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svaply -d svaply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Python 3.11 = verzia z backend/Dockerfile; Pillow 13 vyžaduje Python >= 3.11.
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-test.txt

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-test.txt

    # Celá backend suita proti PostgreSQL (DATABASE_URL); Django si pre testy vytvorí databázu `test_svaply`.
    # Coverage je vypnutá z rovnakého dôvodu ako v jobe `checks`.
    # Poistka pred suitou: pri chýbajúcom alebo nerozpoznanom DATABASE_URL Django ticho použije SQLite
    # (backend/swaply/settings_split/database.py). Celá suita by prešla zelená a testy so zámkami riadkov
    # (nálezy 232, 246, 296), kvôli ktorým tento job existuje a ktoré sa na SQLite preskakujú, by sa nevykonali.
    # Poistka beží v tom istom kroku ako suita, aby čítala presne tú istú `env`.
    - name: Run backend tests on PostgreSQL
      working-directory: ./backend
      run: |
        python - <<'PY'
        import os

        import django

        os.environ.setdefault("DJANGO_SETTINGS_MODULE", "swaply.settings")
        django.setup()
        from django.db import connection

        if connection.vendor != "postgresql":
            raise SystemExit(
                f"Beh backend-postgres používa databázu {connection.vendor}, nie PostgreSQL. "
                "Skontroluj DATABASE_URL (chýba alebo má nerozpoznanú schému)."
            )
        PY
        python -m pytest --no-cov
      env:
        DEBUG: 'True'
        SECRET_KEY: ci-check-secret
        SAFESEARCH_ENABLED: 'False'
        DATABASE_URL: postgresql://svaply:svaply-ci@localhost:5432/svaply
